<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif
        }
        section{
            display: block;
            margin: auto;
            width: 600px;
            height: auto;
            background-color: rgb(248, 171, 255);
            box-shadow: 0px 3px 10px rgb(48, 47, 50);
            padding: 15px;
        }
        header{
            text-align:center;
        }

        img{
            height: 200px;
            width: 200px;
            display: block;
            margin: auto;
        }
        select, input[type="submit"], textarea{
            width:100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Rate a Movie</h1>
        <img src="https://png.pngtree.com/element_our/png/20181113/clapperboard-film-logo-icon-design-template-vector-isolated-png_236642.jpg" alt="movie logo">
        <p>Movies can enteratin people by making us feel different emotions and making us feel like we're part of the experience. </p>
    </header>
    <br>

    <section>
        <form action="">
            <label for="movie">Select a Movie</label>
            <select id="movie" name="movie">
                <option values="">Select a Movie</option>
                <option values="movie1">Flipped</option>
                <option values="movie2">Grown Ups</option>
                <option values="movie3">Insidious: Out of the Further</option>
            </select>
            <br><br>

            <label for="Genre">Genre/s</label>
            <br>
            <input type="checkbox" id="genre1" name="genre1" value="genre">
            <label for="Genre1">Action</label>
            <input type="checkbox" id="genre2" name="genre2" value="genre">
            <label for="Genre2">Comedy</label>
            <input type="checkbox" id="genre3" name="genre3" value="genre">
            <label for="Genre3">Horror</label>
            <input type="checkbox" id="genre4" name="genre4" value="genre">
            <label for="Genre4">Sci-Fi</label>
            <input type="radio" id="genre5" name="genre5" value="genre">
            <label for="Genre5">Other</label>
            
            <br><br>
            <label for="rating">Rating</label>
            <br>
            <input type="radio" id="rate1" name="rating" value="rate1">
             <label for="rate1">⭐</label>
            <input type="radio" id="rate2" name="rating" value="rate2">
             <label for="rate1">⭐⭐</label>
            <input type="radio" id="rate3" name="rating" value="rate3">
             <label for="rate1">⭐⭐⭐</label>
            <input type="radio" id="rate4" name="rating" value="rate4">
             <label for="rate1">⭐⭐⭐⭐</label>
            <input type="radio" id="rate5" name="rating" value="rate5">
             <label for="rate1">⭐⭐⭐⭐⭐</label> 
            <br><br> 

            <textarea id="review" name="review" cols="40" rows="4" placeholder="write your review here..."></textarea>

            <br><br>

            <input type="submit" id="submit" name="review" value="Submit a Review">

            <br>
            For more review tips, click <a inref="https://www.imdb.com/" targert="_blank">here.</a>
        </form>
     </section>

</body>
</html>
